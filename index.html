<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Structural Heart Toolkit — HeartFlow Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .hfc-nav {
      position: sticky; top: 0; z-index: 9999;
      background: rgba(3,13,26,0.95);

      max-width: 1100px; margin: 0 auto;

    .hfc-back {
      display: flex; align-items: center; gap: 8px;

<body>
  <nav class="hfc-nav">
    <div class="hfc-nav-inner">
      <a class="hfc-back" href="index.html">← All Platforms</a>
      <div class="hfc-brand">
        <div class="hfc-icon">🫀</div>
        <div class="hfc-name">HeartFlow Clinic</div>

  <div id="root"></div>
  <script type="text/babel">
const { useState } = React;

// ═══════════════════════════════════════════════════════════════
// SHARED DESIGN SYSTEM
// ═══════════════════════════════════════════════════════════════

const BADGE_PAL = {
  green:  { bg:"rgba(16,185,129,0.12)",  bd:"rgba(16,185,129,0.35)",  c:"#10b981" },
  yellow: { bg:"rgba(245,158,11,0.12)",  bd:"rgba(245,158,11,0.35)",  c:"#f59e0b" },
  red:    { bg:"rgba(239,68,68,0.12)",   bd:"rgba(239,68,68,0.35)",   c:"#ef4444" },
  blue:   { bg:"rgba(59,130,246,0.15)",  bd:"rgba(59,130,246,0.35)",  c:"#7cb9f8" },
  muted:  { bg:"rgba(107,138,170,0.1)",  bd:"rgba(107,138,170,0.25)", c:"#6b8aaa" },
  purple: { bg:"rgba(139,92,246,0.12)",  bd:"rgba(139,92,246,0.35)",  c:"#c4b5fd" },
  cyan:   { bg:"rgba(6,182,212,0.12)",   bd:"rgba(6,182,212,0.35)",   c:"#67e8f9" },
};

const Badge = ({ children, color="blue", style={} }) => {
  const p = BADGE_PAL[color]||BADGE_PAL.blue;
  return <span style={{ display:"inline-flex", alignItems:"center", padding:"3px 12px", borderRadius:20, fontSize:11, fontWeight:700, fontFamily:"'Syne',sans-serif", letterSpacing:"0.05em", background:p.bg, border:`1px solid ${p.bd}`, color:p.c, ...style }}>{children}</span>;
};

const CARD  = { background:"#071528", border:"1px solid rgba(56,139,253,0.15)", borderRadius:16, padding:"28px 32px", marginBottom:16 };
const GRID2 = { display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 };
const GRID3 = { display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16 };
const DIV   = { border:"none", borderTop:"1px solid rgba(56,139,253,0.12)", margin:"20px 0" };
const H2    = { fontSize:22, fontWeight:700, color:"#e2eaf4", fontFamily:"'Syne',sans-serif", margin:"0 0 6px 0" };
const H3    = { fontSize:14, fontWeight:700, color:"#e2eaf4", fontFamily:"'Syne',sans-serif", margin:"0 0 14px 0" };
const MUTED = { fontSize:14, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif", lineHeight:1.6 };
const LABEL = { display:"block", fontSize:11, fontWeight:500, color:"#6b8aaa", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:8, fontFamily:"'DM Sans',sans-serif" };
const INPUT_BASE = { width:"100%", background:"#0c1f38", border:"1px solid rgba(56,139,253,0.18)", borderRadius:10, padding:"12px 16px", color:"#e2eaf4", fontFamily:"'DM Sans',sans-serif", fontSize:14, outline:"none", boxSizing:"border-box", transition:"border-color 0.2s,box-shadow 0.2s" };

const SCard = ({ title, desc, children, style }) => (
  <div style={{ ...CARD, ...style }}>
    {title && <p style={H2}>{title}</p>}
    {desc  && <p style={{ ...MUTED, marginBottom:24 }}>{desc}</p>}
    {children}
  </div>
);

const MissingCard = ({ fields }) => !fields.length ? null : (
  <div style={{ background:"rgba(245,158,11,0.07)", border:"1px solid rgba(245,158,11,0.25)", borderRadius:12, padding:"16px 20px", marginBottom:16 }}>
    <p style={{ ...H3, color:"#f59e0b", marginBottom:8 }}>⚠ Required Fields</p>
    {fields.map(f=><p key={f} style={{ margin:"3px 0", fontSize:13, color:"#fde68a", fontFamily:"'DM Sans',sans-serif" }}>· {f}</p>)}
  </div>
);

const KV = ({ label, value, badge, color }) => (
  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
    <span style={{ fontSize:13, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif" }}>{label}</span>
    {badge ? <Badge color={color||"blue"}>{value}</Badge> : <span style={{ fontSize:13, fontWeight:600, color:"#e2eaf4", fontFamily:"'DM Sans',sans-serif" }}>{value}</span>}
  </div>
);

const MiniCard = ({ title, icon, borderColor, children }) => (
  <div style={{ background:"#071528", border:`1px solid ${borderColor||"rgba(56,139,253,0.15)"}`, borderRadius:14, padding:"18px 20px" }}>
    <p style={{ ...H3, display:"flex", alignItems:"center", gap:7 }}>{icon} {title}</p>
    {children}
  </div>
);

const Accordion = ({ title, children }) => {
  const [open,setOpen] = useState(false);
  return (
    <div style={{ background:"rgba(56,139,253,0.05)", border:"1px solid rgba(56,139,253,0.15)", borderRadius:12, marginTop:12 }}>
      <button onClick={()=>setOpen(!open)} style={{ width:"100%", background:"transparent", border:"none", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer", color:"#7cb9f8", fontFamily:"'Syne',sans-serif", fontSize:12, fontWeight:700, letterSpacing:"0.06em", textTransform:"uppercase" }}>
        {title} <span>{open?"▲":"▼"}</span>
      </button>
      {open && <div style={{ padding:"0 16px 16px", borderTop:"1px solid rgba(56,139,253,0.12)" }}>{children}</div>}
    </div>
  );
};

const SpecRow = ({ label, value }) => (
  <div style={{ display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:"1px solid rgba(56,139,253,0.08)", fontSize:12, fontFamily:"'DM Sans',sans-serif" }}>
    <span style={{ color:"#6b8aaa" }}>{label}</span>
    <span style={{ color:"#e2eaf4", fontWeight:600 }}>{value}</span>
  </div>
);

const FieldInput = ({ label, id, value, onChange, placeholder, unit, helper, integer }) => {
  const [f,setF]=useState(false);
  return (
    <div>
      <label style={LABEL} htmlFor={id}>{label}{unit&&<span style={{opacity:0.55}}> ({unit})</span>}</label>
      <input id={id} type="number" step={integer?"1":"0.1"} placeholder={placeholder} value={value??""} onChange={onChange}
        onFocus={()=>setF(true)} onBlur={()=>setF(false)}
        style={{ ...INPUT_BASE, borderColor:f?"#3b82f6":"rgba(56,139,253,0.18)", boxShadow:f?"0 0 0 3px rgba(59,130,246,0.15)":"none" }} />
      {helper&&<p style={{ fontSize:11, color:"#6b8aaa", margin:"5px 0 0 0", fontFamily:"'DM Sans',sans-serif" }}>{helper}</p>}
    </div>
  );
};

const FieldSelect = ({ label, id, value, onChange, options }) => (
  <div>
    {label&&<label style={LABEL} htmlFor={id}>{label}</label>}
    <div style={{ position:"relative" }}>
      <select id={id} value={value} onChange={onChange} style={{ ...INPUT_BASE, appearance:"none", cursor:"pointer" }}>
        {options.map(o=><option key={o.value??o} value={o.value??o}>{o.label??o}</option>)}
      </select>
      <span style={{ position:"absolute", right:14, top:"50%", transform:"translateY(-50%)", pointerEvents:"none", color:"#6b8aaa", fontSize:11 }}>▾</span>
    </div>
  </div>
);

const Disclaimer = ({ text }) => (
  <div style={{ background:"#071528", border:"1px solid rgba(56,139,253,0.12)", borderRadius:12, padding:"14px 18px", display:"flex", gap:10, marginTop:16 }}>
    <span style={{ fontSize:16, flexShrink:0 }}>⚠️</span>
    <p style={{ margin:0, fontSize:12, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif", lineHeight:1.7 }}>{text}</p>
  </div>
);

// ═══════════════════════════════════════════════════════════════
// TAVR MODULE (preserved exactly)
// ═══════════════════════════════════════════════════════════════

const TAVR_TABS = [
  { id:"overview",    label:"Overview",    short:"01" },
  { id:"ct-annulus",  label:"CT Annulus",  short:"02" },
  { id:"ct-sinus",    label:"CT Sinus",    short:"03" },
  { id:"valve-type",  label:"Valve Type",  short:"04" },
  { id:"access",      label:"Access",      short:"05" },
  { id:"ecg",         label:"ECG",         short:"06" },
  { id:"guidewire",   label:"Guidewire",   short:"07" },
  { id:"balloon",     label:"Balloon",     short:"08" },
  { id:"coronary",    label:"Coronary",    short:"09" },
  { id:"summary",     label:"Summary",     short:"10" },
];
const TAVR_DEFAULT = {
  annulus:{ calcification:"Mild", elliptical:false, lvotCalcification:false, heavyAsymmetricCalcium:false },
  sinus:{},
  access:{ calcification:"Low" }, ecg:{ bbb:"None", avBlock:"None" },
  guidewire:{ lvCavitySize:"Normal" },
  balloonPredilatation:{ severelyCalcified:false, criticalAS:false, severeLVDysfunction:false, assessCompliance:false },
  coronary:{ calcificationSeverity:"Mild" },
  valveType:{ type:"Tricuspid", bavSubtype:"" },
};

const tMeanDiam=(a,b)=>a!==undefined&&b!==undefined?(a+b)/2:undefined;
const tAccess=(acc)=>{
  const{rightFemoralMin:rf,rightIliacMin:ri,leftFemoralMin:lf,leftIliacMin:li,calcification:c}=acc;
  if([rf,ri,lf,li].some(v=>v===undefined))return{status:"incomplete"};
  const rM=Math.min(rf,ri),lM=Math.min(lf,li),best=Math.max(rM,lM),side=rM>=lM?"Right":"Left";
  if(best<5.0)return{status:"not-feasible",preferredSide:side,minDiameter:best};
  if(best<5.5)return{status:"borderline",preferredSide:side,minDiameter:best,warning:c==="Severe"?"Severe calcification increases risk":undefined};
  return{status:"feasible",preferredSide:side,minDiameter:best,warning:c==="Severe"?"Feasible but high-risk due to severe calcification":undefined};
};
const tPacing=(ecg)=>{
  if(ecg.bbb==="LBBB"||ecg.bbb==="RBBB")return{recommendation:"Temporary RV pacing",reason:`${ecg.bbb} detected`};
  if(ecg.avBlock==="2°"||ecg.avBlock==="3°")return{recommendation:"Temporary RV pacing",reason:`${ecg.avBlock} AV block detected`};
  return{recommendation:"Wire pacing",reason:"No high-risk conduction abnormalities"};
};
const tGuidewire=(lv,md)=>{
  if(lv==="Small"||(md&&md<=23))return"Safari Small";
  if(lv==="Large"||(md&&md>=28))return"Safari Large";
  return"Safari Medium";
};
const tBalloonSize=(md,calc)=>{
  if(!md||!calc)return undefined;
  const c=calc.toLowerCase();
  if(md>=20&&md<=22)return c==="mild"?{min:20,max:20}:c==="moderate"?{min:18,max:20}:{min:18,max:18};
  if(md>=23&&md<=25)return c==="mild"?{min:22,max:23}:c==="moderate"?{min:20,max:22}:{min:20,max:20};
  if(md>=26&&md<=28)return c==="mild"?{min:24,max:25}:c==="moderate"?{min:22,max:24}:{min:22,max:23};
  if(md>=29&&md<=31)return c==="mild"?{min:26,max:28}:c==="moderate"?{min:24,max:26}:{min:23,max:25};
  return undefined;
};
const tBalloon=(d)=>{
  const{balloonPredilatation:b,annulus:a}=d;
  const r=[];
  if(b.severelyCalcified)r.push("Severely calcified aortic valve");
  if(b.criticalAS)r.push("Critical AS with very tight orifice");
  if(b.severeLVDysfunction)r.push("Severe LV dysfunction");
  if(b.assessCompliance)r.push("Need to assess annulus compliance");
  if(!r.length)return{recommended:false,reasons:["No indications — suggest direct TAVI"]};
  const md=tMeanDiam(a.minDiameter,a.maxDiameter);
  return{recommended:true,reasons:r,balloonSize:tBalloonSize(md,a.calcification)};
};
const tCoronary=(cor,sinusDiam,bavSubtype)=>{
  if((cor.leftMainHeight===undefined&&cor.rightCoronaryHeight===undefined)||sinusDiam===undefined)return{risk:"incomplete"};
  const leftLow=cor.leftMainHeight!==undefined&&cor.leftMainHeight<10;
  const rightLow=cor.rightCoronaryHeight!==undefined&&cor.rightCoronaryHeight<10;
  const leftLeafletRisk=leftLow&&cor.leftLeafletLength!==undefined&&cor.leftLeafletLength>=16;
  const rightLeafletRisk=rightLow&&cor.rightLeafletLength!==undefined&&cor.rightLeafletLength>=16;
  const leftBothRisk=leftLow&&cor.leftLeafletLength!==undefined&&cor.leftLeafletLength<16;
  const rightBothRisk=rightLow&&cor.rightLeafletLength!==undefined&&cor.rightLeafletLength<16;
  const bavType0=bavSubtype==="Type 0";
  const assess=(h)=>{
    if(h===undefined)return null;
    let r=h<10||sinusDiam<28?"high":(h<12||sinusDiam<30)?"moderate":"low";
    if(cor.calcificationSeverity==="Severe"&&r!=="high")r=r==="low"?"moderate":"high";
    if(cor.calcificationSeverity==="Mild"&&r==="moderate")r="low";
    if(bavType0&&r!=="high")r="high";
    return{height:h,riskLevel:r};
  };
  const l=assess(cor.leftMainHeight),r=assess(cor.rightCoronaryHeight);
  const risks=[l?.riskLevel,r?.riskLevel].filter(Boolean);
  const mx=risks.includes("high")?"high":risks.includes("moderate")?"moderate":"low";
  const recs=[];
  if(mx==="high"){recs.push("Consider self-expandable valve (Evolut or Navitor)");if(l?.riskLevel==="high")recs.push("Wire left main coronary before deployment");if(r?.riskLevel==="high")recs.push("Wire right coronary before deployment");}
  if(bavType0)recs.push("Bicuspid Type 0 (true fusion): significantly elevated coronary obstruction risk");
  return{risk:mx,leftMain:l,rightCoronary:r,sinusDiameter:sinusDiam,calcificationSeverity:cor.calcificationSeverity,recommendations:recs,
    leftLow,rightLow,leftLeafletRisk,rightLeafletRisk,leftBothRisk,rightBothRisk,bavType0};
};
const tEdwards=(area)=>{
  if(!area)return{eligible:false};
  const ranges=[{size:20,min:273,max:345,nominal:328},{size:23,min:338,max:430,nominal:406},{size:26,min:430,max:546,nominal:519},{size:29,min:540,max:683,nominal:649}];
  const m=ranges.filter(r=>area>=r.min&&area<=r.max);
  if(!m.length)return{eligible:false,tooSmall:area<273,tooLarge:area>683};
  return{eligible:true,results:m.map(r=>{const p=((r.nominal-area)/area)*100;const cat=p<0?"very-undersized":p<5?"undersized":p<=15?"optimal":p<=20?"high":"excessive";return{size:r.size,oversizing:p.toFixed(1),cat};})};
};
const tEvolut=(md,pe,sd,sh)=>{
  if(!md||!pe||!sd||!sh)return{eligible:false};
  const r=[{size:23,minD:18,maxD:20,minP:56.5,maxP:62.8,minS:25,minSH:15},{size:26,minD:20,maxD:23,minP:62.8,maxP:72.3,minS:27,minSH:15},{size:29,minD:23,maxD:26,minP:72.3,maxP:81.7,minS:29,minSH:15},{size:34,minD:26,maxD:30,minP:81.7,maxP:94.2,minS:31,minSH:16}];
  const sizes=r.filter(x=>md>=x.minD&&md<=x.maxD&&pe>=x.minP&&pe<=x.maxP&&sd>=x.minS&&sh>=x.minSH).map(x=>x.size);
  return{eligible:sizes.length>0,sizes};
};
const tNavitor=(md,area,pe)=>{
  if(!md||!area||!pe)return{eligible:false};
  const r=[{size:23,minD:19,maxD:21,minA:277,maxA:346,minP:60,maxP:66},{size:25,minD:21,maxD:23,minA:338,maxA:415,minP:66,maxP:73},{size:27,minD:23,maxD:25,minA:405,maxA:491,minP:72,maxP:79},{size:29,minD:25,maxD:27,minA:479,maxA:573,minP:79,maxP:85},{size:35,minD:27,maxD:30,minA:559,maxA:707,minP:85,maxP:95}];
  const sizes=r.filter(x=>md>=x.minD&&md<=x.maxD&&area>=x.minA&&area<=x.maxA&&pe>=x.minP&&pe<=x.maxP).map(x=>x.size);
  return{eligible:sizes.length>0,sizes};
};
const tOvColor=(cat)=>cat==="optimal"?"green":(cat==="high"||cat==="undersized")?"yellow":"red";
const tOvMsg=(cat)=>({optimal:"Optimal (5–15%)",high:"High but acceptable (15–20%)",undersized:"Under-sized <5% — PVL risk",excessive:"Excessive >20% — rupture risk","very-undersized":"Very under-sized — PVL / embolization risk"}[cat]||"");
const tRiskColor=(r)=>r==="low"?"green":r==="moderate"?"yellow":r==="high"?"red":"muted";

// TAVR sub-components
const TavrOverview=({onStart})=>{
  const steps=[{n:1,icon:"📐",title:"CT Measurements",desc:"Enter annulus and sinus dimensions"},{n:2,icon:"🫀",title:"Valve Morphology",desc:"Tricuspid vs Bicuspid (BAV subtype)"},{n:3,icon:"🗺",title:"Access Assessment",desc:"Evaluate iliofemoral access route"},{n:4,icon:"💓",title:"ECG Analysis",desc:"Identify conduction abnormalities"},{n:5,icon:"🔵",title:"Guidewire Selection",desc:"Recommend Safari wire size"},{n:6,icon:"🎈",title:"Balloon Predilatation",desc:"Assess need for BAV"},{n:7,icon:"⚡",title:"Coronary Risk",desc:"Predict coronary obstruction risk"},{n:8,icon:"📋",title:"Summary",desc:"Generate full TAVR planning report"}];
  const outcomes=["Valve sizing — Edwards / Medtronic / Abbott","Oversizing % with safety classification","Access route feasibility & preferred side","Pacing strategy (RV vs wire pacing)","Safari guidewire recommendation","Balloon predilatation decision + balloon size","Coronary obstruction risk classification"];
  return(
    <div>
      <div style={{background:"linear-gradient(135deg,#071528 0%,#0c2044 60%,#0e2a52 100%)",border:"1px solid rgba(56,139,253,0.2)",borderRadius:20,padding:"40px",marginBottom:24,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-80,right:-80,width:300,height:300,background:"rgba(59,130,246,0.08)",borderRadius:"50%",filter:"blur(40px)",pointerEvents:"none"}}/>
        <div style={{position:"relative"}}>
          <div style={{fontSize:11,fontWeight:500,color:"#06b6d4",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:14,display:"flex",alignItems:"center",gap:8}}><span style={{width:24,height:1,background:"#06b6d4",display:"inline-block"}}/>TAVR Planning Module</div>
          <h1 style={{margin:0,fontSize:32,fontWeight:800,fontFamily:"'Syne',sans-serif",background:"linear-gradient(135deg,#e2eaf4 30%,#7cb9f8 70%,#67e8f9)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>TAVI Procedure Guidance</h1>
          <p style={{margin:"8px 0 0 0",fontSize:15,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif"}}>AI-assisted workflow for CT-based TAVR planning</p>
        </div>
      </div>
      <p style={{...H2,marginBottom:16}}>Workflow Steps</p>
      <div style={{...GRID2,marginBottom:28}}>{steps.map(s=><div key={s.n} style={{background:"#071528",border:"1px solid rgba(56,139,253,0.15)",borderRadius:14,padding:"16px 18px",display:"flex",gap:14,alignItems:"flex-start"}}><div style={{minWidth:36,height:36,background:"linear-gradient(135deg,#3b82f6,#06b6d4)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,color:"#fff",fontFamily:"'Syne',sans-serif",flexShrink:0}}>{s.n}</div><div><p style={{margin:0,fontSize:14,fontWeight:700,color:"#e2eaf4",fontFamily:"'Syne',sans-serif"}}>{s.icon} {s.title}</p><p style={{margin:"3px 0 0 0",fontSize:12,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif"}}>{s.desc}</p></div></div>)}</div>
      <div style={{display:"flex",justifyContent:"center",marginBottom:28}}><button onClick={onStart} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",color:"#fff",border:"none",borderRadius:12,padding:"14px 44px",fontSize:15,fontWeight:600,fontFamily:"'Syne',sans-serif",cursor:"pointer",boxShadow:"0 4px 20px rgba(59,130,246,0.35)"}}>Start Workflow →</button></div>
      <p style={{...H2,marginBottom:16}}>Expected Outcomes</p>
      <div style={{...GRID3,marginBottom:24}}>{outcomes.map((o,i)=><div key={i} style={{background:"#071528",border:"1px solid rgba(56,139,253,0.13)",borderRadius:10,padding:"12px 14px",fontSize:12,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}><span style={{color:"#3b82f6"}}>✓ </span>{o}</div>)}</div>
      <Disclaimer text="This tool supports clinical decision-making and does not replace clinical judgment."/>
    </div>
  );
};

const CheckToggle=({checked,onChange,label,sublabel})=>(

const TavrSummary=({data})=>{
  const [meta,setMeta]=useState({ patientId:"", operator:"" });
  const md=tMeanDiam(data.annulus.minDiameter,data.annulus.maxDiameter);
  const ed=tEdwards(data.annulus.area),ev=tEvolut(md,data.annulus.perimeter,data.sinus.meanDiameter,data.sinus.meanHeight),nv=tNavitor(md,data.annulus.area,data.annulus.perimeter);
  const ac=tAccess(data.access),pa=tPacing(data.ecg),gw=tGuidewire(data.guidewire.lvCavitySize,md),bl=tBalloon(data),co=tCoronary(data.coronary,data.sinus.meanDiameter,data.valveType?.bavSubtype);
  const acC=ac.status==="feasible"?"green":ac.status==="borderline"?"yellow":ac.status==="not-feasible"?"red":"muted";
  const paC=pa.recommendation==="Temporary RV pacing"?"yellow":"green";
  const blC=bl.recommended?"yellow":"green";
  const coB=co.risk==="low"?"rgba(16,185,129,0.3)":co.risk==="moderate"?"rgba(245,158,11,0.3)":"rgba(239,68,68,0.3)";

  const buildTavrReport=()=>{
    const sections=[];
    // Measurements
    sections.push({ title:"CT Annulus & Sinus Measurements", html:`<table>${reportRows([
      ["Annulus area", data.annulus.area?`${data.annulus.area} mm²`:null],
      ["Min / Max diameter", (data.annulus.minDiameter&&data.annulus.maxDiameter)?`${data.annulus.minDiameter} / ${data.annulus.maxDiameter} mm`:null],
      ["Mean diameter", md?`${md.toFixed(1)} mm`:null],
      ["Perimeter", data.annulus.perimeter?`${data.annulus.perimeter} mm`:null],
      ["Annulus calcification", data.annulus.calcification],
      ["Sinus of Valsalva mean diameter", data.sinus.meanDiameter?`${data.sinus.meanDiameter} mm`:null],
      ["Sinus mean height", data.sinus.meanHeight?`${data.sinus.meanHeight} mm`:null],
      ["Native valve morphology", data.valveType?.type + (data.valveType?.bavSubtype?` — ${data.valveType.bavSubtype}`:"")],
    ])}</table>`});

    // Valve sizing
    let sizingHtml="<table>";
    if(ed.eligible&&ed.results){ ed.results.forEach(r=>{ sizingHtml+=`<tr><td class="k">Edwards SAPIEN 3 — Size ${r.size} mm</td><td class="v">${parseFloat(r.oversizing)>=0?"+":""}${r.oversizing}% · ${esc(tOvMsg(r.cat))}</td></tr>`; }); }
    else sizingHtml+=`<tr><td class="k">Edwards SAPIEN 3</td><td class="v">Not eligible</td></tr>`;
    sizingHtml+=`<tr><td class="k">Medtronic Evolut</td><td class="v">${ev.eligible&&ev.sizes?ev.sizes.map(s=>s+" mm").join(", "):"Not eligible"}</td></tr>`;
    sizingHtml+=`<tr><td class="k">Abbott Navitor</td><td class="v">${nv.eligible&&nv.sizes?nv.sizes.map(s=>s+" mm").join(", "):"Not eligible"}</td></tr>`;
    sizingHtml+="</table>";
    sections.push({ title:"Valve Sizing Recommendations", html:sizingHtml });

    // Procedural strategy
    sections.push({ title:"Procedural Strategy", html:`<table>${reportRows([
      ["Femoral access", ac.status==="incomplete"?"Incomplete data":(ac.status==="feasible"?"Feasible":ac.status==="borderline"?"Borderline":"Not feasible")],
      ["Preferred side", ac.status!=="incomplete"&&ac.status!=="not-feasible"?ac.preferredSide:null],
      ["Min access diameter", ac.minDiameter?`${ac.minDiameter.toFixed(1)} mm`:null],
      ["Pacing strategy", pa.recommendation],
      ["Guidewire", gw],
      ["Balloon predilatation", bl.recommended?`Recommended${bl.balloonSize?` (${bl.balloonSize.min}–${bl.balloonSize.max} mm)`:""}`:"Not required"],
    ])}</table>${ac.warning?`<div class="note warn">⚠ ${esc(ac.warning)}</div>`:""}`});

    // Coronary
    if(co.risk!=="incomplete"){
      let cHtml=`<table>${reportRows([
        ["Overall coronary obstruction risk", co.risk.charAt(0).toUpperCase()+co.risk.slice(1)],
        ["Left main height", co.leftMain?`${co.leftMain.height?.toFixed(1)} mm (${co.leftMain.riskLevel})`:null],
        ["Right coronary height", co.rightCoronary?`${co.rightCoronary.height?.toFixed(1)} mm (${co.rightCoronary.riskLevel})`:null],
        ["Sinus of Valsalva diameter", co.sinusDiameter?`${co.sinusDiameter.toFixed(1)} mm`:null],
        ["Calcification severity", co.calcificationSeverity],
      ])}</table>`;
      if(co.recommendations?.length){ cHtml+=`<div class="note danger">${co.recommendations.map(r=>"→ "+esc(r)).join("<br>")}</div>`; }
      sections.push({ title:"Coronary Obstruction Risk", html:cHtml });
    }

    // Risk flags
    const riskFlags=[];
    if(data.annulus.lvotCalcification) riskFlags.push("LVOT calcification present — annular rupture risk");
    const edOver=ed.eligible&&ed.results&&ed.results.some(r=>parseFloat(r.oversizing)>=20);
    if(edOver) riskFlags.push("Valve oversizing ≥ 20% — annular rupture risk; consider undersizing");
    if(data.annulus.elliptical) riskFlags.push("Elliptical annulus — paravalvular leak risk");
    if(data.annulus.heavyAsymmetricCalcium) riskFlags.push("Heavy asymmetric calcium — paravalvular leak risk");
    if(data.valveType?.bavSubtype==="Type 0") riskFlags.push("Bicuspid Type 0 — significantly elevated coronary obstruction risk");
    if(riskFlags.length){ sections.push({ title:"Procedural Risk Flags", html:`<div class="note danger"><ul class="clean">${riskFlags.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>` }); }

    const riskColor = co.risk==="high"||riskFlags.length ? "#dc4343" : co.risk==="moderate" ? "#c98a1e" : "#1f9d6b";
    const primaryDevice = ed.eligible&&ed.results ? `Edwards SAPIEN 3 ${ed.results[0].size} mm` : ev.eligible&&ev.sizes ? `Medtronic Evolut ${ev.sizes[0]} mm` : nv.eligible&&nv.sizes ? `Abbott Navitor ${nv.sizes[0]} mm` : "No eligible device — review measurements";

    generateReport({
      title:"TAVI Procedure Planning",
      subtitle:"CT-Based Transcatheter Planning",
      accent:"#2f6fd6",
      meta,
      verdict:{ label:"Planning Summary", title:primaryDevice, summary:`Overall coronary obstruction risk: ${co.risk==="incomplete"?"not assessed":co.risk}. ${riskFlags.length?`${riskFlags.length} procedural risk flag(s) identified — see below.`:"No major procedural risk flags identified."}`, color:riskColor },
      sections,
    });
  };
  return(<div>

      </div>
      <div style={{marginBottom:22,paddingBottom:22,borderBottom:"1px solid rgba(56,139,253,0.1)"}}>

        {ev.eligible&&ev.sizes?<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{ev.sizes.map(s=><Badge key={s} color="blue">{s} mm</Badge>)}</div>:<p style={{fontSize:13,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",margin:0}}>Missing: mean diameter, perimeter, sinus diameter, or sinus height</p>}

        {nv.eligible&&nv.sizes?<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{nv.sizes.map(s=><Badge key={s} color="blue">{s} mm</Badge>)}</div>:<p style={{fontSize:13,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",margin:0}}>Missing: mean diameter, annulus area, or perimeter</p>}

    <div style={{...GRID2,marginBottom:14}}>
      <MiniCard title="Femoral Access" icon="🗺" borderColor={ac.status==="feasible"?"rgba(16,185,129,0.3)":ac.status==="borderline"?"rgba(245,158,11,0.3)":ac.status==="not-feasible"?"rgba(239,68,68,0.3)":"rgba(56,139,253,0.15)"}>

      </div>
      {co.recommendations?.length>0&&<div style={{background:"rgba(239,68,68,0.07)",border:"1px solid rgba(239,68,68,0.2)",borderLeft:"4px solid #ef4444",borderRadius:10,padding:"12px 16px",marginBottom:12}}>{co.recommendations.map((r,i)=><p key={i} style={{margin:"3px 0",fontSize:13,color:"#fca5a5",fontFamily:"'DM Sans',sans-serif"}}>→ {r}</p>)}</div>}
      {/* Leaflet length risk detail */}
      {(co.leftBothRisk||co.rightBothRisk||co.leftLeafletRisk||co.rightLeafletRisk)&&<div style={{background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
        <p style={{margin:"0 0 6px",fontSize:11,fontWeight:700,color:"#fca5a5",fontFamily:"'Syne',sans-serif",textTransform:"uppercase",letterSpacing:"0.07em"}}>Leaflet-Based Obstruction Risk</p>
        {co.leftBothRisk&&<p style={{margin:"2px 0",fontSize:12,color:"#fca5a5",fontFamily:"'DM Sans',sans-serif"}}>· LM: Height &lt;10 mm + Leaflet length &lt;16 mm → Coronary obstruction risk</p>}
        {co.leftLeafletRisk&&<p style={{margin:"2px 0",fontSize:12,color:"#ef4444",fontFamily:"'DM Sans',sans-serif",fontWeight:700}}>· LM: Height &lt;10 mm + Leaflet length ≥16 mm → SIGNIFICANT coronary obstruction risk</p>}
        {co.rightBothRisk&&<p style={{margin:"2px 0",fontSize:12,color:"#fca5a5",fontFamily:"'DM Sans',sans-serif"}}>· RCA: Height &lt;10 mm + Leaflet length &lt;16 mm → Coronary obstruction risk</p>}
        {co.rightLeafletRisk&&<p style={{margin:"2px 0",fontSize:12,color:"#ef4444",fontFamily:"'DM Sans',sans-serif",fontWeight:700}}>· RCA: Height &lt;10 mm + Leaflet length ≥16 mm → SIGNIFICANT coronary obstruction risk</p>}
      </div>}
      <div style={{fontSize:11,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",lineHeight:1.8,paddingTop:10,borderTop:"1px solid rgba(56,139,253,0.1)"}}><strong style={{color:"#e2eaf4"}}>Risk criteria:</strong> Low: CH ≥12 mm & SOV ≥30 mm · Moderate: CH 10–12 mm or SOV 28–30 mm · High: CH &lt;10 mm or SOV &lt;28 mm<br/>SOV diameter: {co.sinusDiameter?.toFixed(1)??"—"} mm · Calcification: {co.calcificationSeverity}</div>
    </div>}
    {/* Annular Rupture Risk Summary Panel */}
    {(data.annulus.lvotCalcification||(()=>{const edRes=tEdwards(data.annulus.area);return edRes.eligible&&edRes.results&&edRes.results.some(r=>parseFloat(r.oversizing)>=20);})())&&(
      <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.35)",borderLeft:"4px solid #ef4444",borderRadius:14,padding:"16px 20px",marginBottom:14}}>
        <p style={{...H3,color:"#fca5a5",marginBottom:8}}>⚠️ Annular Rupture Risk Factors</p>
        {data.annulus.lvotCalcification&&<p style={{margin:"3px 0",fontSize:13,color:"#fca5a5",fontFamily:"'DM Sans',sans-serif"}}>· LVOT calcification present</p>}
        {(()=>{const edRes=tEdwards(data.annulus.area);return edRes.eligible&&edRes.results&&edRes.results.some(r=>parseFloat(r.oversizing)>=20);})()&&<p style={{margin:"3px 0",fontSize:13,color:"#fca5a5",fontFamily:"'DM Sans',sans-serif"}}>· Valve oversizing ≥20% — consider valve undersizing strategy</p>}
        <p style={{margin:"8px 0 0",fontSize:11,color:"#f87171",fontFamily:"'DM Sans',sans-serif"}}>Ensure surgical backup is available. Consider balloon post-dilation with extreme caution.</p>
      </div>
    )}
    {/* PVL Risk Summary Panel */}
    {(data.annulus.elliptical||data.annulus.heavyAsymmetricCalcium||(()=>{const edRes=tEdwards(data.annulus.area);return edRes.eligible&&edRes.results&&edRes.results.some(r=>r.cat==="undersized"||r.cat==="very-undersized");})())&&(
      <div style={{background:"rgba(139,92,246,0.08)",border:"1px solid rgba(139,92,246,0.3)",borderLeft:"4px solid #8b5cf6",borderRadius:14,padding:"16px 20px",marginBottom:14}}>
        <p style={{...H3,color:"#c4b5fd",marginBottom:8}}>⚠️ Paravalvular Leak (PVL) Risk Factors</p>
        {data.annulus.elliptical&&<p style={{margin:"3px 0",fontSize:13,color:"#c4b5fd",fontFamily:"'DM Sans',sans-serif"}}>· Elliptical annulus — incomplete frame apposition risk</p>}
        {data.annulus.heavyAsymmetricCalcium&&<p style={{margin:"3px 0",fontSize:13,color:"#c4b5fd",fontFamily:"'DM Sans',sans-serif"}}>· Heavy asymmetric calcium — uneven sealing risk</p>}
        {(()=>{const edRes=tEdwards(data.annulus.area);return edRes.eligible&&edRes.results&&edRes.results.some(r=>r.cat==="undersized"||r.cat==="very-undersized");})()&&<p style={{margin:"3px 0",fontSize:13,color:"#c4b5fd",fontFamily:"'DM Sans',sans-serif"}}>· Under-sized valve detected (&lt;5% oversizing)</p>}
        <p style={{margin:"8px 0 0",fontSize:11,color:"#a78bfa",fontFamily:"'DM Sans',sans-serif"}}>Consider valve-in-valve or balloon post-dilation. Ensure post-deployment aortogram is performed.</p>
      </div>
    )}
    {/* Valve type summary */}
    {data.valveType&&data.valveType.type==="Bicuspid"&&<div style={{background:"rgba(59,130,246,0.07)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:14,padding:"14px 20px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div><p style={{...LABEL,marginBottom:2}}>Native Valve Morphology</p><p style={{margin:0,fontSize:13,color:"#e2eaf4",fontFamily:"'DM Sans',sans-serif"}}>Bicuspid Aortic Valve{data.valveType.bavSubtype?` — ${data.valveType.bavSubtype}`:""}</p></div>
      <Badge color={data.valveType.bavSubtype==="Type 0"?"red":"yellow"}>{data.valveType.bavSubtype==="Type 0"?"High CO Risk":"BAV — Elevated Risk"}</Badge>
    </div>}
    <Disclaimer text="This tool supports clinical decision-making and does not replace clinical judgment. All recommendations should be evaluated in the context of individual patient characteristics and institutional protocols."/>

    {/* Export */}
    <div style={{...CARD,marginTop:16}}>
      <p style={{...H3,marginBottom:14}}>📄 Export Report</p>
      <ReportMeta meta={meta} onChange={setMeta}/>
      <ReportButton accent="#2f6fd6" onClick={buildTavrReport}>Generate PDF Report</ReportButton>
      <p style={{margin:"10px 0 0",fontSize:11,color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",textAlign:"center"}}>Opens a print-ready page — choose "Save as PDF" in the print dialog.</p>
    </div>
  </div>);
};

// TAVR wrapper
const TavrModule=({onBack})=>{
  const [tab,setTab]=useState("overview");
  const [data,setData]=useState(TAVR_DEFAULT);
  const containerRef=React.useRef(null);
  const goTab=(id)=>{
    setTab(id);
    setTimeout(()=>{
      if(containerRef.current){
        containerRef.current.scrollIntoView({behavior:"smooth",block:"start"});
      }
      window.scrollTo({top:0,behavior:"smooth"});
      document.documentElement.scrollTop=0;
      document.body.scrollTop=0;
    },10);
  };
  const idx=TAVR_TABS.findIndex(t=>t.id===tab);
  const upd=React.useCallback((k)=>(v)=>setData(d=>({...d,[k]:v})),[]);
  const isOk=(id)=>{
    switch(id){
      case"overview":return true;
      case"ct-annulus":return!!(data.annulus.area&&data.annulus.minDiameter&&data.annulus.maxDiameter&&data.annulus.perimeter&&data.annulus.calcification);
      case"ct-sinus":return!!(data.sinus.meanDiameter&&data.sinus.meanHeight);
      case"valve-type":return!!(data.valveType.type&&(data.valveType.type==="Tricuspid"||data.valveType.bavSubtype));
      case"access":return data.access.rightFemoralMin!==undefined&&data.access.rightIliacMin!==undefined&&data.access.leftFemoralMin!==undefined&&data.access.leftIliacMin!==undefined;
      case"ecg":return!!(data.ecg.bbb&&data.ecg.avBlock&&data.ecg.qrs);
      case"guidewire":return!!data.guidewire.lvCavitySize;
      case"balloon":return true;
      case"coronary":return!!(data.coronary.leftMainHeight&&data.coronary.rightCoronaryHeight&&data.coronary.calcificationSeverity);
      case"summary":return true;
      default:return true;
    }
  };
  const canNext=idx<TAVR_TABS.length-1&&isOk(TAVR_TABS[idx].id);
  const progress=(idx/(TAVR_TABS.length-1))*100;
  const renderTab=()=>{
    switch(tab){
      case"overview":     return <TavrOverview onStart={()=>goTab("ct-annulus")}/>;
      case"ct-annulus":   return <TavrCTAnnulus data={data.annulus} onChange={upd("annulus")}/>;
      case"ct-sinus":     return <TavrCTSinus data={data.sinus} onChange={upd("sinus")}/>;
      case"valve-type":   return <TavrValveType data={data.valveType} onChange={upd("valveType")}/>;
      case"access":       return <TavrAccess data={data.access} onChange={upd("access")}/>;
      case"ecg":          return <TavrECG data={data.ecg} onChange={upd("ecg")}/>;
      case"guidewire":    return <TavrGuidewire data={data.guidewire} onChange={upd("guidewire")}/>;
      case"balloon":      return <TavrBalloon data={data.balloonPredilatation} onChange={upd("balloonPredilatation")}/>;
      case"coronary":     return <TavrCoronary data={data.coronary} onChange={upd("coronary")} valveType={data.valveType}/>;
      case"summary":      return <TavrSummary data={data}/>;
      default:            return null;
    }
  };
  return(
    <div ref={containerRef}>
      <div style={{height:3,background:"#0c1f38",borderRadius:2,marginBottom:28,overflow:"hidden"}}><div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#3b82f6,#06b6d4)",borderRadius:2,transition:"width 0.5s ease",boxShadow:"0 0 10px rgba(59,130,246,0.5)"}}/></div>
      <div style={{display:"flex",gap:4,overflowX:"auto",marginBottom:24,background:"#071528",border:"1px solid rgba(56,139,253,0.15)",borderRadius:14,padding:6}}>
        {TAVR_TABS.map(t=>{const a=t.id===tab;return(<button key={t.id} onClick={()=>goTab(t.id)} style={{flex:"0 0 auto",padding:"7px 14px",borderRadius:9,border:"none",background:a?"linear-gradient(135deg,#3b82f6,#06b6d4)":"transparent",color:a?"#fff":"#6b8aaa",fontWeight:a?700:400,fontSize:12.5,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",transition:"all 0.2s",whiteSpace:"nowrap"}}><span style={{opacity:a?0.8:0.4,marginRight:4,fontSize:10,fontFamily:"'Syne',sans-serif"}}>{t.short}</span>{t.label}</button>);})}
      </div>
      <div>{renderTab()}</div>
      {tab!=="overview"&&<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:28,paddingTop:20,borderTop:"1px solid rgba(56,139,253,0.12)"}}>
        <button onClick={()=>goTab(TAVR_TABS[idx-1].id)} style={{background:"transparent",border:"1.5px solid rgba(56,139,253,0.2)",borderRadius:10,padding:"11px 22px",color:"#6b8aaa",fontFamily:"'DM Sans',sans-serif",fontSize:14,cursor:"pointer"}}>← Back</button>
        <div style={{textAlign:"center"}}><span style={{fontSize:11,color:"#6b8aaa",fontFamily:"'Syne',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase"}}>{idx}/{TAVR_TABS.length-1} — {TAVR_TABS[idx].label}</span>{!isOk(TAVR_TABS[idx].id)&&tab!=="summary"&&<p style={{margin:"4px 0 0 0",fontSize:11,color:"#ef4444",fontFamily:"'DM Sans',sans-serif"}}>⚠ Fill all required fields to continue</p>}</div>
        {tab!=="summary"?<button onClick={()=>canNext&&goTab(TAVR_TABS[idx+1].id)} disabled={!canNext} style={{background:canNext?"linear-gradient(135deg,#3b82f6,#06b6d4)":"#0c1f38",border:"none",borderRadius:10,padding:"12px 26px",color:canNext?"#fff":"#1e3a5f",fontFamily:"'Syne',sans-serif",fontWeight:600,fontSize:14,cursor:canNext?"pointer":"not-allowed",opacity:canNext?1:0.5}}>Next →</button>:<div style={{width:100}}/>}
      </div>}
    </div>
  );
};

// SHARED PDF / PRINT REPORT GENERATOR
// ═══════════════════════════════════════════════════════════════
// Renders a clean, print-styled document into a new window and opens
// the browser print dialog (user selects "Save as PDF"). No external
// libraries — works reliably inside the sandboxed artifact.

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Build a section of key/value rows
const reportRows = (rows) => rows.filter(Boolean).map(([k, v]) =>
  `<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td></tr>`).join("");

// meta = { patientId, operator }  ·  sections = [{ title, html }]
function generateReport({ title, subtitle, accent = "#3b82f6", meta = {}, verdict, sections = [] }) {
  const now = new Date();
  const stamp = now.toLocaleString(undefined, { year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit" });

  const verdictBlock = verdict ? `
    <div class="verdict" style="border-color:${verdict.color}33;background:${verdict.color}0d">
      <div class="verdict-label">${esc(verdict.label || "Result")}</div>
      <div class="verdict-title" style="color:${verdict.color}">${esc(verdict.title)}</div>
      ${verdict.summary ? `<p class="verdict-summary">${esc(verdict.summary)}</p>` : ""}
    </div>` : "";

  const body = sections.map(s => `
    <section class="block">
      <h2>${esc(s.title)}</h2>
      ${s.html}
    </section>`).join("");

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)} — Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 16mm 14mm; }
    * { box-sizing: border-box; }
    body { font-family:'DM Sans',system-ui,sans-serif; color:#1a2436; margin:0; font-size:12px; line-height:1.5; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid ${accent}; padding-bottom:14px; margin-bottom:6px; }
    .brand { display:flex; align-items:center; gap:11px; }
    .logo { width:38px; height:38px; border-radius:9px; background:${accent}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; }
    .brand h1 { font-family:'Syne',sans-serif; font-size:17px; margin:0; color:#0f1a2e; letter-spacing:-.2px; }
    .brand .sub { font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#7a8aa0; margin-top:2px; }
    .stamp { text-align:right; font-size:10px; color:#7a8aa0; }
    .stamp b { color:#1a2436; font-size:11px; }
    .meta { display:flex; gap:26px; margin:12px 0 4px; }
    .meta div span { display:block; font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:#9aa7b8; }

// ═══════════════════════════════════════════════════════════════
// AORTIC STENOSIS CLASSIFIER MODULE  (ESC/EACVI 2021 logic)
// ═══════════════════════════════════════════════════════════════

const AS_DEFAULT = {
  ava:"", meanGrad:"", vmax:"", lvef:"", lvotD:"", lvotVti:"", bsa:"",
  sex:"", calcium:"",
  dseDone:false, dseAva:"", dseGrad:"", dsePeakVmax:"",
};

// Sex-specific CT calcium score thresholds (Agatston units) — ESC/EACVI
const CA_THRESHOLDS = {
  Male:   { unlikely:1600, likely:2000, label:"♂ Male" },
  Female: { unlikely: 800, likely:1200, label:"♀ Female" },
};

const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : undefined; };

function classifyAS(d) {
  const ava    = num(d.ava);
  const mg      = num(d.meanGrad);
  const vmax    = num(d.vmax);
  const lvef    = num(d.lvef);
  const lvotD   = num(d.lvotD);
  const vti     = num(d.lvotVti);
  const bsa     = num(d.bsa);

  // ---- derived hemodynamics ----
  const lvotArea = lvotD !== undefined ? 0.785 * lvotD * lvotD : undefined; // cm²
  const sv       = (lvotArea !== undefined && vti !== undefined) ? lvotArea * vti : undefined; // mL
  const svi      = (sv !== undefined && bsa !== undefined && bsa > 0) ? sv / bsa : undefined;  // mL/m²

  const derived = {
    lvotArea, sv, svi,
    lvotArea_s: lvotArea !== undefined ? lvotArea.toFixed(2) : "—",
    sv_s:       sv       !== undefined ? sv.toFixed(1)       : "—",
    svi_s:      svi      !== undefined ? svi.toFixed(1)      : "—",
  };

  // ---- required-field gate ----
  const missing = [];
  if (ava === undefined)   missing.push("Aortic Valve Area (AVA)");
  if (mg === undefined && vmax === undefined) missing.push("Mean gradient OR Peak velocity");
  if (lvef === undefined)  missing.push("LV Ejection Fraction");
  if (lvotD === undefined) missing.push("LVOT diameter");
  if (vti === undefined)   missing.push("LVOT VTI");
  if (bsa === undefined)   missing.push("Body Surface Area");

  if (missing.length) return { status:"incomplete", missing, derived };

  // ---- flags ----
  const severeArea  = ava <= 1.0;
  const highGrad    = (mg !== undefined && mg >= 40) || (vmax !== undefined && vmax >= 4.0);
  const lowGrad     = !highGrad;
  const lowEF       = lvef < 50;
  const preservedEF = lvef >= 50;
  const lowFlow     = svi !== undefined && svi < 35;
  const normalFlow  = svi !== undefined && svi >= 35;

  const flags = { severeArea, highGrad, lowGrad, lowEF, preservedEF, lowFlow, normalFlow };

  // ---- Not severe by area ----
  if (!severeArea) {
    if (highGrad) {
      return {
        status:"done", derived, flags,
        code:"CONFLICT", color:"yellow", short:"Indeterminate — Discordant",
        title:"Indeterminate AS — Discordant Data",
        summary:`AVA ${ava.toFixed(2)} cm² is above the severe threshold (>1.0 cm²) yet the gradient is high (≥40 mmHg / Vmax ≥4 m/s). This discordance suggests measurement error, high-flow states, or moderate AS. Re-measure LVOT diameter and confirm alignment of the Doppler beam.`,
        pseudo:null,
      };
    }
    return {
      status:"done", derived, flags,
      code:"NOT_SEVERE", color:"green", short:"Not severe AS",
      title:"AS Not Severe by AVA",
      summary:`AVA ${ava.toFixed(2)} cm² is above the severe threshold (>1.0 cm²) with a low gradient. Findings are consistent with mild–moderate AS. Correlate with valve morphology and follow per surveillance guidelines.`,
      pseudo:null,
    };
  }

  // ---- Severe area (≤1.0) ----
  // A. High-gradient severe AS
  if (highGrad) {
    return {
      status:"done", derived, flags,
      code:"HG", color:"red", short:"High-gradient severe AS",
      title:"High-Gradient Severe AS",
      summary:`AVA ≤1.0 cm² with a high gradient (mean ≥40 mmHg and/or Vmax ≥4 m/s). This is unequivocal severe AS. Flow status does not change the diagnosis. Refer for intervention (AVR/TAVI) evaluation if symptomatic or per ESC criteria.`,
      pseudo:null,
    };
  }

  // Low gradient + severe area → sub-classify by EF & flow
  // B. Classical LFLG (reduced EF)
  if (lowEF && lowFlow) {
    let pseudo = null;
    if (d.dseDone) {
      const dAva  = num(d.dseAva);
      const dGrad = num(d.dseGrad);
      const dVmax = num(d.dsePeakVmax);
      // Contractile reserve = ΔSV ≥20% (proxied here via change in gradient/AVA behaviour)
      // True severe: AVA stays ≤1.0 while gradient rises ≥40 (or Vmax ≥4)
      // Pseudo-severe: AVA increases >1.0 with only modest gradient rise
      if (dAva !== undefined || dGrad !== undefined || dVmax !== undefined) {
        const avaOpens   = dAva !== undefined && dAva > 1.0;
        const gradRises  = (dGrad !== undefined && dGrad >= 40) || (dVmax !== undefined && dVmax >= 4.0);
        if (avaOpens && !gradRises) {
          pseudo = { verdict:"pseudo", label:"Pseudo-severe AS",
            note:`On stress, AVA increases to ${dAva?.toFixed(2)} cm² (>1.0) without a high gradient — consistent with pseudo-severe AS. The valve is not truly severely stenotic; optimize heart-failure therapy.` };
        } else if (gradRises && (dAva === undefined || dAva <= 1.0)) {
          pseudo = { verdict:"true", label:"True severe AS",
            note:`On stress, gradient rises to severe range while AVA remains ≤1.0 cm² — confirms true severe AS with contractile reserve. Proceed toward intervention.` };
        } else {
          pseudo = { verdict:"indeterminate", label:"Indeterminate stress response",
            note:`Stress echo data are discordant or show absent contractile reserve. Consider CT calcium scoring to adjudicate severity.` };
        }
      }
    }
    return {
      status:"done", derived, flags,
      code:"CLFLG", color:"red", short:"Classical LFLG severe AS",
      title:"Classical Low-Flow, Low-Gradient Severe AS",
      summary:`AVA ≤1.0 cm², low gradient (<40 mmHg), reduced LVEF (<50%) and low flow (SVI <35 mL/m²). This is classical LFLG AS. A dobutamine stress echo is recommended to differentiate true-severe from pseudo-severe AS and to assess contractile reserve.`,
      pseudo,
      wantsDSE:true,
    };
  }

  // C. Paradoxical LFLG (preserved EF, low flow)
  if (preservedEF && lowFlow) {
    return {
      status:"done", derived, flags,
      code:"PLFLG", color:"purple", short:"Paradoxical LFLG severe AS",
      title:"Paradoxical Low-Flow, Low-Gradient Severe AS",
      summary:`AVA ≤1.0 cm², low gradient (<40 mmHg), preserved LVEF (≥50%) yet low flow (SVI <35 mL/m²). This is paradoxical LFLG AS — often small hypertrophied ventricles. Confirm severity with CT calcium scoring and exclude measurement error (LVOT, BP control).`,
      pseudo:null,
      wantsCa:true,
    };
  }

  // D. Normal-flow, low-gradient
  if (preservedEF && normalFlow) {
    return {
      status:"done", derived, flags,
      code:"NFLG", color:"cyan", short:"Normal-flow low-gradient AS",
      title:"Normal-Flow, Low-Gradient AS",
      summary:`AVA ≤1.0 cm², low gradient (<40 mmHg), preserved LVEF (≥50%) with normal flow (SVI ≥35 mL/m²). This pattern is most often moderate AS or measurement discordance rather than true severe AS. Re-check AVA/LVOT; consider CT calcium scoring if severity remains uncertain.`,
      pseudo:null,
      wantsCa:true,
    };
  }

  // Low EF but normal flow, or other edge combos
  return {
    status:"done", derived, flags,
    code:"CONFLICT", color:"yellow", short:"Indeterminate AS",
    title:"Indeterminate AS — Conflicting Data",
    summary:`The combination of AVA, gradient, EF and flow does not map cleanly to a single ESC/EACVI category (e.g. reduced EF with preserved flow). Re-verify measurements and consider CT calcium scoring or multimodality assessment.`,
    pseudo:null,
    wantsCa:true,
  };
}

// Calcium score interpretation
function interpretCa(caVal, sex) {
  const ca = num(caVal);
  if (ca === undefined || !sex || !CA_THRESHOLDS[sex]) return null;
  const t = CA_THRESHOLDS[sex];
  if (ca >= t.likely)   return { level:"likely",   color:"red",    text:`Agatston ${ca} ≥ ${t.likely} (${t.label}) — severe AS HIGHLY LIKELY.` };
  if (ca >= t.unlikely) return { level:"grey",     color:"yellow", text:`Agatston ${ca} in the grey zone (${t.unlikely}–${t.likely}, ${t.label}) — severe AS possible; integrate with clinical picture.` };
  return { level:"unlikely", color:"green", text:`Agatston ${ca} < ${t.unlikely} (${t.label}) — severe AS UNLIKELY.` };
}

// ---- flow / gradient / EF chips ----
const FlowChip = ({ ok, label, sub }) => (
  <div style={{ background:"#0c1f38", border:`1px solid ${ok?"rgba(16,185,129,0.3)":"rgba(107,138,170,0.2)"}`, borderRadius:12, padding:"12px 14px", textAlign:"center" }}>
    <p style={{ margin:0, fontSize:11, color:"#6b8aaa", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Sans',sans-serif" }}>{label}</p>
    <p style={{ margin:"5px 0 0", fontSize:16, fontWeight:700, color:ok?"#10b981":"#e2eaf4", fontFamily:"'Syne',sans-serif" }}>{sub}</p>
  </div>
);

// Decision-tree visual
const ASDecisionTree = ({ code }) => {
  const nodes = [
    { id:"HG",    label:"High-gradient severe", color:"red" },
    { id:"CLFLG", label:"Classical LFLG", color:"red" },
    { id:"PLFLG", label:"Paradoxical LFLG", color:"purple" },
    { id:"NFLG",  label:"Normal-flow LG", color:"cyan" },
  ];
  return (
    <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginTop:8 }}>
      {nodes.map(n => {
        const active = n.id === code;
        const p = BADGE_PAL[n.color];
        return (
          <div key={n.id} style={{ flex:"1 1 120px", padding:"10px 12px", borderRadius:10,
            border:`1.5px solid ${active?p.bd:"rgba(56,139,253,0.12)"}`,
            background:active?p.bg:"transparent", opacity:active?1:0.4, transition:"all .3s",
            textAlign:"center" }}>
            <span style={{ fontSize:12, fontWeight:active?700:500, color:active?p.c:"#6b8aaa", fontFamily:"'DM Sans',sans-serif" }}>{n.label}</span>
          </div>
        );
      })}
    </div>
  );
};

const ASModule = ({ onBack }) => {
  const [d, setD] = useState(AS_DEFAULT);
  const [meta, setMeta] = useState({ patientId:"", operator:"" });
  const up = (k) => (e) => setD(s => ({ ...s, [k]: e.target ? e.target.value : e }));
  const res = classifyAS(d);
  const ca = res.status === "done" ? interpretCa(d.calcium, d.sex) : null;
  const rp = res.status === "done" ? (BADGE_PAL[res.color] || BADGE_PAL.blue) : BADGE_PAL.blue;

  const buildASReport = () => {
    const hex = { red:"#dc4343", green:"#1f9d6b", yellow:"#c98a1e", purple:"#7c5cd6", cyan:"#1591a8", blue:"#2f6fd6", muted:"#7a8aa0" };
    const vColor = hex[res.color] || "#2f6fd6";
    const g = (mg) => mg !== undefined ? mg : "—";
    const sections = [];

    sections.push({ title:"Echocardiographic Parameters", html:`<table>${reportRows([
      ["Aortic valve area (AVA)", `${d.ava} cm²`],
      ["Mean transaortic gradient", d.meanGrad !== "" ? `${d.meanGrad} mmHg` : "—"],
      ["Peak aortic velocity (Vmax)", d.vmax !== "" ? `${d.vmax} m/s` : "—"],
      ["LV ejection fraction", `${d.lvef} %`],
      ["LVOT diameter", `${d.lvotD} cm`],
      ["LVOT VTI", `${d.lvotVti} cm`],
      ["Body surface area", `${d.bsa} m²`],
    ])}</table>` });

    sections.push({ title:"Calculated Flow Metrics", html:`<table>${reportRows([
      ["LVOT area  (0.785 × D²)", `${res.derived.lvotArea_s} cm²`],
      ["Stroke volume  (LVOT area × VTI)", `${res.derived.sv_s} mL`],
      ["Stroke volume index  (SV ÷ BSA)", `${res.derived.svi_s} mL/m²`],
      ["Flow status", res.derived.svi !== undefined ? (res.derived.svi < 35 ? "Low flow (< 35)" : "Normal flow (≥ 35)") : "—"],
    ])}</table>` });

    // adjuncts
    const adjunct = [];
    if (d.dseDone) {
      adjunct.push(["— Dobutamine stress echo —", ""]);
      adjunct.push(["Stress AVA", d.dseAva !== "" ? `${d.dseAva} cm²` : "—"]);
      adjunct.push(["Stress mean gradient", d.dseGrad !== "" ? `${d.dseGrad} mmHg` : "—"]);
      adjunct.push(["Stress peak Vmax", d.dsePeakVmax !== "" ? `${d.dsePeakVmax} m/s` : "—"]);
    }
    if (d.sex || d.calcium) {
      adjunct.push(["Sex", d.sex || "—"]);
      adjunct.push(["CT calcium score", d.calcium !== "" ? `${d.calcium} Agatston` : "—"]);
    }
    if (adjunct.length) sections.push({ title:"Optional Adjuncts", html:`<table>${reportRows(adjunct)}</table>` });

    // pseudo-severe verdict
    if (res.pseudo) {
      const pc = res.pseudo.verdict === "true" ? "danger" : res.pseudo.verdict === "pseudo" ? "" : "warn";
      sections.push({ title:"Stress Echo Adjudication", html:
        `<div class="note ${pc}"><b>${esc(res.pseudo.label)}</b><br>${esc(res.pseudo.note)}</div>` });
    }
    if (ca) {
      const cc = ca.color === "red" ? "danger" : ca.color === "yellow" ? "warn" : "";
      sections.push({ title:"CT Calcium Interpretation", html:`<div class="note ${cc}">${esc(ca.text)}</div>` });
    }

    // classification criteria trace
    if (res.flags) {
      sections.push({ title:"Classification Criteria Met", html:`<ul class="clean">
        <li>AVA ${num(d.ava) <= 1.0 ? "≤ 1.0 cm² — severe by area" : "> 1.0 cm² — not severe by area"}</li>
        <li>Gradient ${res.flags.highGrad ? "high (≥ 40 mmHg / Vmax ≥ 4 m/s)" : "low (< 40 mmHg)"}</li>
        <li>LV function ${res.flags.preservedEF ? "preserved (LVEF ≥ 50%)" : "reduced (LVEF < 50%)"}</li>
        <li>Flow ${res.flags.normalFlow ? "normal (SVI ≥ 35 mL/m²)" : "low (SVI < 35 mL/m²)"}</li>
      </ul>` });
    }

    generateReport({
      title:"Aortic Stenosis Classification",
      subtitle:"ESC / EACVI Severity Logic",
      accent:vColor,
      meta,
      verdict:{ label:"Final Classification", title:res.title, summary:res.summary, color:vColor },
      sections,
    });
  };

  return (
    <div>
      {/* Hero */}
      <div style={{ background:"linear-gradient(135deg,#071528 0%,#0c2044 60%,#0e2a52 100%)", border:"1px solid rgba(56,139,253,0.2)", borderRadius:20, padding:"36px 40px", marginBottom:24, position:"relative", overflow:"hidden" }}>
        <div style={{ position:"absolute", top:-90, right:-70, width:280, height:280, background:"rgba(139,92,246,0.1)", borderRadius:"50%", filter:"blur(50px)", pointerEvents:"none" }}/>
        <div style={{ position:"relative" }}>
          <div style={{ fontSize:11, fontWeight:500, color:"#c4b5fd", textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:14, display:"flex", alignItems:"center", gap:8 }}><span style={{ width:24, height:1, background:"#c4b5fd", display:"inline-block" }}/>Severity Classification Module</div>
          <h1 style={{ margin:0, fontSize:30, fontWeight:800, fontFamily:"'Syne',sans-serif", background:"linear-gradient(135deg,#e2eaf4 30%,#c4b5fd 70%,#7cb9f8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>Aortic Stenosis Subtype Classifier</h1>
          <p style={{ margin:"8px 0 0", fontSize:15, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif" }}>Automated ESC/EACVI classification · true-severe vs pseudo-severe adjudication</p>
        </div>
      </div>

      {/* Echo inputs */}
      <SCard title="Echocardiographic & Hemodynamic Parameters" desc="Core measurements required for classification.">
        <div style={GRID3}>
          <FieldInput label="Aortic Valve Area" id="as-ava" unit="cm²" placeholder="e.g. 0.8" value={d.ava} onChange={up("ava")} helper="Continuity equation"/>
          <FieldInput label="Mean Gradient" id="as-mg" unit="mmHg" placeholder="e.g. 32" value={d.meanGrad} onChange={up("meanGrad")} integer/>
          <FieldInput label="Peak Aortic Velocity" id="as-vmax" unit="m/s" placeholder="e.g. 3.6" value={d.vmax} onChange={up("vmax")}/>
          <FieldInput label="LV Ejection Fraction" id="as-ef" unit="%" placeholder="e.g. 55" value={d.lvef} onChange={up("lvef")} integer/>
          <FieldInput label="LVOT Diameter" id="as-lvot" unit="cm" placeholder="e.g. 2.1" value={d.lvotD} onChange={up("lvotD")}/>
          <FieldInput label="LVOT VTI" id="as-vti" unit="cm" placeholder="e.g. 18" value={d.lvotVti} onChange={up("lvotVti")}/>
          <FieldInput label="Body Surface Area" id="as-bsa" unit="m²" placeholder="e.g. 1.85" value={d.bsa} onChange={up("bsa")}/>
        </div>

        {/* live derived readout */}
        <hr style={DIV}/>
        <p style={{ ...LABEL, marginBottom:12 }}>Auto-Calculated Flow Metrics</p>
        <div style={GRID3}>
          <FlowChip ok={false} label="LVOT Area (cm²)" sub={res.derived.lvotArea_s}/>
          <FlowChip ok={false} label="Stroke Volume (mL)" sub={res.derived.sv_s}/>
          <FlowChip ok={res.derived.svi !== undefined && res.derived.svi >= 35} label="SV Index (mL/m²)" sub={res.derived.svi_s}/>
        </div>
        <p style={{ margin:"12px 0 0", fontSize:11, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif" }}>SV = 0.785 × LVOT diameter² × LVOT VTI · SVI = SV ÷ BSA · low-flow threshold SVI &lt; 35 mL/m²</p>
      </SCard>

      {/* Optional adjuncts */}
      <SCard title="Optional Adjuncts" desc="Dobutamine stress echo and CT calcium scoring refine severity in low-gradient states.">
        <div style={{ ...GRID2, marginBottom:4 }}>
          <div>
            <FieldSelect label="Sex (for calcium thresholds)" id="as-sex" value={d.sex} onChange={up("sex")}
              options={[{value:"",label:"— select —"},{value:"Male",label:"Male"},{value:"Female",label:"Female"}]}/>
          </div>
          <FieldInput label="CT Calcium Score" id="as-ca" unit="Agatston" placeholder="e.g. 1800" value={d.calcium} onChange={up("calcium")} integer/>
        </div>
        {ca && (
          <div style={{ marginTop:8, padding:"12px 16px", borderRadius:10, background:BADGE_PAL[ca.color].bg, border:`1px solid ${BADGE_PAL[ca.color].bd}` }}>
            <p style={{ margin:0, fontSize:13, color:BADGE_PAL[ca.color].c, fontFamily:"'DM Sans',sans-serif", lineHeight:1.6 }}>{ca.text}</p>
          </div>
        )}

        <hr style={DIV}/>
        <div onClick={() => setD(s => ({ ...s, dseDone: !s.dseDone }))} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 18px", borderRadius:12, border:`1.5px solid ${d.dseDone?"rgba(59,130,246,0.4)":"rgba(56,139,253,0.15)"}`, cursor:"pointer", background:d.dseDone?"rgba(59,130,246,0.07)":"#0c1f38", transition:"all 0.2s" }}>
          <div style={{ width:22, height:22, borderRadius:6, border:`2px solid ${d.dseDone?"#3b82f6":"rgba(56,139,253,0.3)"}`, background:d.dseDone?"#3b82f6":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:12, color:"#fff" }}>{d.dseDone && "✓"}</div>
          <div style={{ flex:1 }}><span style={{ fontSize:14, color:"#e2eaf4", fontFamily:"'DM Sans',sans-serif" }}>Dobutamine stress echo performed</span><p style={{ margin:"2px 0 0", fontSize:11, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif" }}>Enter low-dose stress values to differentiate true-severe vs pseudo-severe</p></div>
          <Badge color={d.dseDone?"blue":"muted"}>{d.dseDone?"On":"Off"}</Badge>
        </div>
        {d.dseDone && (
          <div style={{ ...GRID3, marginTop:14 }}>
            <FieldInput label="Stress AVA" id="as-dava" unit="cm²" placeholder="e.g. 1.1" value={d.dseAva} onChange={up("dseAva")}/>
            <FieldInput label="Stress Mean Gradient" id="as-dgrad" unit="mmHg" placeholder="e.g. 45" value={d.dseGrad} onChange={up("dseGrad")} integer/>
            <FieldInput label="Stress Peak Vmax" id="as-dvmax" unit="m/s" placeholder="e.g. 4.2" value={d.dsePeakVmax} onChange={up("dsePeakVmax")}/>
          </div>
        )}
      </SCard>

      {/* RESULT */}
      {res.status === "incomplete" ? (
        <MissingCard fields={res.missing}/>
      ) : (
        <div style={{ ...CARD, borderColor:rp.bd, boxShadow:`0 0 40px ${rp.bg}`, background:`linear-gradient(160deg,#071528, ${rp.bg})` }}>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:16, flexWrap:"wrap" }}>
            <div>
              <p style={{ ...LABEL, marginBottom:6 }}>Final Classification</p>
              <p style={{ margin:0, fontSize:26, fontWeight:800, color:rp.c, fontFamily:"'Syne',sans-serif", lineHeight:1.2 }}>{res.title}</p>
            </div>
            <Badge color={res.color} style={{ fontSize:12, padding:"6px 16px" }}>{res.short}</Badge>
          </div>

          <ASDecisionTree code={res.code}/>

          <p style={{ ...MUTED, marginTop:18 }}>{res.summary}</p>

          {/* flow/gradient/EF status strip */}
          {res.flags && (
            <>
              <hr style={DIV}/>
              <div style={GRID3}>
                <FlowChip ok={res.flags.highGrad} label="Gradient" sub={res.flags.highGrad?"High ≥40":"Low <40"}/>
                <FlowChip ok={res.flags.preservedEF} label="LV Function" sub={res.flags.preservedEF?"Preserved ≥50%":"Reduced <50%"}/>
                <FlowChip ok={res.flags.normalFlow} label="Flow (SVI)" sub={res.flags.normalFlow?"Normal ≥35":"Low <35"}/>
              </div>
            </>
          )}

          {/* pseudo-severe adjudication */}
          {res.pseudo && (
            <div style={{ marginTop:16, padding:"16px 20px", borderRadius:12, border:`1px solid ${BADGE_PAL[res.pseudo.verdict==="true"?"red":res.pseudo.verdict==="pseudo"?"green":"yellow"].bd}`, background:BADGE_PAL[res.pseudo.verdict==="true"?"red":res.pseudo.verdict==="pseudo"?"green":"yellow"].bg }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
                <span style={{ fontSize:16 }}>🧪</span>
                <p style={{ margin:0, fontSize:15, fontWeight:700, fontFamily:"'Syne',sans-serif", color:BADGE_PAL[res.pseudo.verdict==="true"?"red":res.pseudo.verdict==="pseudo"?"green":"yellow"].c }}>Stress Echo Verdict: {res.pseudo.label}</p>
              </div>
              <p style={{ margin:0, fontSize:13, color:"#c9d6e5", fontFamily:"'DM Sans',sans-serif", lineHeight:1.6 }}>{res.pseudo.note}</p>
            </div>
          )}

          {/* nudges */}
          {res.wantsDSE && !d.dseDone && (
            <div style={{ marginTop:14, padding:"12px 16px", borderRadius:10, background:"rgba(59,130,246,0.08)", border:"1px solid rgba(59,130,246,0.25)" }}>
              <p style={{ margin:0, fontSize:13, color:"#7cb9f8", fontFamily:"'DM Sans',sans-serif" }}>→ Enable the dobutamine stress echo section above to distinguish true-severe from pseudo-severe AS.</p>
            </div>
          )}
          {res.wantsCa && !ca && (
            <div style={{ marginTop:14, padding:"12px 16px", borderRadius:10, background:"rgba(139,92,246,0.08)", border:"1px solid rgba(139,92,246,0.25)" }}>
              <p style={{ margin:0, fontSize:13, color:"#c4b5fd", fontFamily:"'DM Sans',sans-serif" }}>→ Add sex + CT calcium score above for independent confirmation of severity.</p>
            </div>
          )}

          <Disclaimer text="Classification follows ESC/EACVI 2021 valvular heart disease logic. This tool supports — but does not replace — expert echocardiographic interpretation and multidisciplinary heart-team judgment."/>

          {/* Export */}
          <hr style={DIV}/>
          <p style={{ ...H3, marginBottom:14 }}>📄 Export Report</p>
          <ReportMeta meta={meta} onChange={setMeta}/>
          <ReportButton accent="#8b5cf6" onClick={buildASReport}>Generate PDF Report</ReportButton>
          <p style={{ margin:"10px 0 0", fontSize:11, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif", textAlign:"center" }}>Opens a print-ready page — choose "Save as PDF" in the print dialog.</p>
        </div>
      )}
    </div>
  );
};

// ── Landing hub ──────────────────────────────────────────────
const ToolCard = ({ accent, tag, icon, title, desc, points, cta, onClick }) => {
  const [hov, setHov] = useState(false);
  const p = BADGE_PAL[accent] || BADGE_PAL.blue;
  return (
    <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ position:"relative", background:"linear-gradient(160deg,#071528, #0a1c34)", border:`1px solid ${hov?p.bd:"rgba(56,139,253,0.15)"}`, borderRadius:20, padding:"30px 30px 26px", cursor:"pointer", overflow:"hidden", transition:"all .3s", transform:hov?"translateY(-4px)":"none", boxShadow:hov?`0 18px 50px -12px ${p.bg}`:"0 2px 12px rgba(0,0,0,0.3)" }}>
      <div style={{ position:"absolute", top:-70, right:-50, width:220, height:220, background:p.bg, borderRadius:"50%", filter:"blur(50px)", opacity:hov?1:0.5, transition:"opacity .3s", pointerEvents:"none" }}/>
      <div style={{ position:"relative" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18 }}>
          <div style={{ width:52, height:52, borderRadius:14, background:`linear-gradient(135deg, ${p.c}, ${p.c}55)`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, boxShadow:`0 0 24px ${p.bg}` }}>{icon}</div>
          <Badge color={accent}>{tag}</Badge>
        </div>
        <p style={{ margin:0, fontSize:21, fontWeight:800, color:"#e2eaf4", fontFamily:"'Syne',sans-serif", lineHeight:1.2 }}>{title}</p>
        <p style={{ margin:"8px 0 16px", fontSize:14, color:"#6b8aaa", fontFamily:"'DM Sans',sans-serif", lineHeight:1.6 }}>{desc}</p>
        <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:20 }}>
          {points.map((pt,i)=><div key={i} style={{ display:"flex", alignItems:"center", gap:8, fontSize:12.5, color:"#8ba3bd", fontFamily:"'DM Sans',sans-serif" }}><span style={{ color:p.c }}>✦</span>{pt}</div>)}
        </div>
        <div style={{ display:"inline-flex", alignItems:"center", gap:8, color:p.c, fontFamily:"'Syne',sans-serif", fontWeight:700, fontSize:13, letterSpacing:"0.04em" }}>{cta} <span style={{ transition:"transform .3s", transform:hov?"translateX(4px)":"none" }}>→</span></div>
      </div>
    </div>
  );
};

const HomeHub = ({ onOpen }) => (
  <div>
    <div style={{ background:"linear-gradient(135deg,#071528 0%,#0c2044 55%,#10123a 100%)", border:"1px solid rgba(56,139,253,0.2)", borderRadius:24, padding:"46px 44px", marginBottom:26, position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:-100, right:-60, width:340, height:340, background:"rgba(59,130,246,0.1)", borderRadius:"50%", filter:"blur(60px)", pointerEvents:"none" }}/>
      <div style={{ position:"absolute", bottom:-120, left:-40, width:280, height:280, background:"rgba(139,92,246,0.08)", borderRadius:"50%", filter:"blur(60px)", pointerEvents:"none" }}/>
      <div style={{ position:"relative" }}>
        <div style={{ fontSize:11, fontWeight:500, color:"#67e8f9", textTransform:"uppercase", letterSpacing:"0.14em", marginBottom:16, display:"flex", alignItems:"center", gap:8 }}><span style={{ width:28, height:1, background:"#67e8f9", display:"inline-block" }}/>Structural Heart Toolkit</div>
        <h1 style={{ margin:0, fontSize:38, fontWeight:800, fontFamily:"'Syne',sans-serif", lineHeight:1.1, background:"linear-gradient(120deg,#e2eaf4 20%,#7cb9f8 55%,#c4b5fd 90%)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", maxWidth:560 }}>Aortic valve decision support, from severity to intervention</h1>
        <p style={{ margin:"14px 0 0", fontSize:16, color:"#8ba3bd", fontFamily:"'DM Sans',sans-serif", maxWidth:540, lineHeight:1.6 }}>Two integrated modules built on current ESC/EACVI standards — classify the stenosis, then plan the transcatheter procedure.</p>
      </div>
    </div>

    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:18 }}>
      <ToolCard accent="purple" tag="ESC/EACVI" icon="🩺" title="AS Subtype Classifier"
        desc="Enter echo + clinical parameters and auto-classify the aortic stenosis subtype, with true-severe vs pseudo-severe adjudication."
        points={["High-gradient & LFLG phenotyping","Auto SV / SVI flow calculation","DSE + CT calcium integration"]}
        cta="Classify a patient" onClick={()=>onOpen("as")}/>
      <ToolCard accent="blue" tag="CT Planning" icon="🫀" title="TAVI Procedure Guidance"
        desc="CT-based transcatheter aortic valve planning: annular sizing, access, coronary risk and device selection."
        points={["Valve sizing (Edwards / Medtronic / Abbott)","Access & pacing strategy","Coronary obstruction risk"]}
        cta="Plan a procedure" onClick={()=>onOpen("tavr")}/>
    </div>
  </div>
);

function App() {
  const [view, setView] = useState("home"); // home | as | tavr

  const HEADER = {
    home: { name:"Structural Heart", sub:"Clinical Decision Support", grad:"linear-gradient(135deg,#3b82f6,#8b5cf6)" },
    as:   { name:"AS Classifier",    sub:"ESC / EACVI Severity Logic", grad:"linear-gradient(135deg,#8b5cf6,#06b6d4)" },
    tavr: { name:"TAVI Guidance",    sub:"Clinical Decision Support", grad:"linear-gradient(135deg,#3b82f6,#06b6d4)" },
  }[view];

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #040d1a; color: #e2eaf4; font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { opacity: 0.4; }
        input::placeholder { color: #6b8aaa; }
        select option { background: #0c1f38; color: #e2eaf4; }
        input:focus, select:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important; outline: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #040d1a; }
        ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes drift  { from { transform:translate(0,0) scale(1); } to { transform:translate(30px,20px) scale(1.05); } }
        .view-in { animation: fadeIn .45s ease both; }
        .tab-btn:hover { border-color: rgba(59,130,246,0.35) !important; color: #e2eaf4 !important; }
        .back-btn:hover { border-color: rgba(107,138,170,0.5) !important; color: #e2eaf4 !important; }
        @media (max-width: 720px){ .hub-grid, .grid-2, .grid-3 { grid-template-columns: 1fr !important; } }
      `}</style>

      {/* Ambient orbs */}
      <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0, overflow:"hidden" }}>
        <div style={{ position:"absolute", width:600, height:600, background:"#1a3a8f", borderRadius:"50%", filter:"blur(80px)", opacity:0.22, top:-200, left:-200, animation:"drift 12s ease-in-out infinite alternate" }} />
        <div style={{ position:"absolute", width:400, height:400, background:"#0e3a5e", borderRadius:"50%", filter:"blur(80px)", opacity:0.16, top:"40%", right:-100, animation:"drift 12s ease-in-out infinite alternate", animationDelay:"-4s" }} />
        <div style={{ position:"absolute", width:300, height:300, background:"#2d1b69", borderRadius:"50%", filter:"blur(80px)", opacity:0.14, bottom:-100, left:"30%", animation:"drift 12s ease-in-out infinite alternate", animationDelay:"-8s" }} />
      </div>

      <div style={{ position:"relative", zIndex:1, maxWidth:880, margin:"0 auto", padding:"0 20px 80px" }}>
        <header style={{ display:"flex", alignItems:"center", padding:"24px 0 20px" }}>
          <div style={{ width:44, height:44, background:HEADER.grad, borderRadius:12, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0, boxShadow:"0 0 24px rgba(59,130,246,0.4)" }}>🫀</div>
          <div style={{ marginLeft:14, flex:1 }}>
            <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, background:"linear-gradient(90deg,#e2eaf4,#7cb9f8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>{HEADER.name}</div>
            <div style={{ fontSize:11, color:"#6b8aaa", letterSpacing:"0.08em", textTransform:"uppercase", marginTop:1, fontFamily:"'DM Sans',sans-serif" }}>{HEADER.sub}</div>
          </div>
          {view !== "home" && (
            <button className="back-btn" onClick={()=>{ setView("home"); window.scrollTo({top:0,behavior:"smooth"}); }}
              style={{ background:"transparent", border:"1.5px solid rgba(107,138,170,0.3)", borderRadius:10, padding:"9px 18px", color:"#8ba3bd", fontFamily:"'DM Sans',sans-serif", fontSize:13, cursor:"pointer", transition:"all .2s" }}>← Toolkit</button>
          )}
        </header>

        <div key={view} className="view-in">
          {view === "home" && <HomeHub onOpen={setView} />}
          {view === "as"   && <ASModule onBack={()=>setView("home")} />}
          {view === "tavr" && <TavrModule onBack={()=>setView("home")} />}
        </div>
      </div>
    </>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
